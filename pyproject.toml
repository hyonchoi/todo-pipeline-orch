[project]
name = "hermes-pipeline"
version = "0.6.1"
description = "Autonomous TODOS.md pipeline orchestrator (Hermes-agent selection, kanban, merge-gating)"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "python-ulid>=2.2",
]

[project.scripts]
tpo = "hermes_pipeline.cli:main"
pipeline-watch = "hermes_pipeline.deprecated_entry:pipeline_watch_deprecated"
hermes-pipeline = "hermes_pipeline.deprecated_entry:hermes_pipeline_deprecated"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.12",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hermes_pipeline"]

[tool.ruff]
target-version = "py312"
exclude = ["docs/old-code"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
]
ignore = [
    "E501", # line too long
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # unused imports in __init__
"tests/**" = ["E402", "E741", "E731", "E702", "F841", "RUF015", "RUF043", "RUF059"]

[tool.pytest.ini_options]
python_files = ["test_*.py", "runner.py"]
testpaths = ["tests"]
