name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs for the same ref when a new commit is pushed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0  # Release evidence tests verify source-commit ancestry.

      - name: Set up uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf  # v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Check release artifact consistency
        run: |
          uv run --no-sync python - <<'PY'
          import pathlib
          import re
          import tomllib

          version = pathlib.Path("VERSION").read_text().strip()
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          lock = tomllib.loads(pathlib.Path("uv.lock").read_text())
          locked = next(
              package["version"]
              for package in lock["package"]
              if package["name"] == "hermes-pipeline"
          )
          changelog = pathlib.Path("CHANGELOG.md").read_text()

          assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version), (
              f"invalid VERSION: {version!r}"
          )
          assert project["project"]["version"] == version, (
              "pyproject.toml version differs from VERSION"
          )
          assert locked == version, (
              "uv.lock hermes-pipeline version differs from VERSION"
          )
          assert re.search(
              rf"^## \[{re.escape(version)}\] - [0-9]{{4}}-[0-9]{{2}}-[0-9]{{2}}$",
              changelog,
              re.MULTILINE,
          ), "CHANGELOG.md has no dated entry for VERSION"
          PY

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest --cov=hermes_pipeline --cov-report=term-missing

  lint:
    name: ruff
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf  # v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run ruff check
        run: uv run ruff check .
