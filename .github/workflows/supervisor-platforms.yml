name: Supervisor platforms

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: supervisor-platforms-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  darwin:
    name: supervisor (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    env:
      REQUIRE_NATIVE_DARWIN: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf
        with:
          enable-cache: true
      - name: Install test dependencies
        run: uv sync --locked --python 3.13
      - name: Check native ownership and process cleanup
        run: uv run --python 3.13 pytest -q tests/test_agent_darwin.py --basetemp .hermes/pytest-darwin
